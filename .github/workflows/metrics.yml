name: metrics

# Nightly activity refresh: GitHub stars and last-commit date, Hugging Face
# downloads.
#
# Pushes DIRECTLY to main, and that is deliberate. These numbers are
# observations the bot reads from GitHub and Hugging Face — not editorial. A
# nightly pull request saying "1,411 stars became 1,415" is not something a
# human can meaningfully approve, and seven of them a week trains you to merge
# without looking, which is worse than not reviewing at all.
#
# What still protects the catalogue:
#   - validate.py refuses a run where a HUMAN has hand-edited a metrics block,
#     so the bot's ownership of these fields is enforced, not assumed
#   - a failed lookup keeps its previous value, so an API outage cannot make a
#     live project look abandoned
#   - generate + validate both run before anything is pushed; a broken
#     catalogue never reaches main
#
# Editorial content — entries, digests, the taxonomy — still arrives by pull
# request. This exception is for machine-owned fields only.
on:
  schedule:
    - cron: '41 3 * * *'   # 03:41 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh metrics
        env:
          # The default token lifts the API rate limit from 60 to 5,000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/refresh_metrics.py

      - name: Regenerate derived files
        run: python3 tools/generate.py

      - name: Validate catalogue
        run: python3 tools/validate.py

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "metrics unchanged"
            exit 0
          fi
          git config user.name  'pathologyai-bot'
          git config user.email 'bot@pathologyai.org'
          git add -A
          # [skip ci] because generate.py has already run above — letting this
          # push trigger the generate workflow would have it regenerate
          # identical files and push again, every night, forever.
          git commit -m 'chore: refresh activity metrics [skip ci]'
          git push
