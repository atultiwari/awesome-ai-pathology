name: generate

# Rebuilds README, browse/ and api/ whenever the catalogue changes on main.
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tools/**'
      - 'schema/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # Without this the bot's own commit retriggers the workflow forever.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Regenerate
        run: python3 tools/generate.py

      - name: Commit if anything changed
        run: |
          # Stage FIRST, then test the staged diff. Testing the working tree
          # before staging let an unstaged generated file (index.html) report a
          # change and then produce an empty commit, which fails.
          git add README.md index.html .nojekyll browse api
          if git diff --cached --quiet; then
            echo "already current — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate catalogue [skip ci]"
          git push
